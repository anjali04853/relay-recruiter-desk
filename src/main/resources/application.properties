server.address=127.0.0.1
server.port=${PORT:8080}
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=jdbc:h2:file:./data/recruiter-desk;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.live-send=${LIVE_SEND:false}
app.from=${MAIL_FROM:}
app.provider-url=${POST_PROVIDER_URL:}
app.provider-token=${POST_PROVIDER_TOKEN:}
app.linkedin-id=${LINKEDIN_CLIENT_ID:}
app.linkedin-secret=${LINKEDIN_CLIENT_SECRET:}
app.redirect-uri=${LINKEDIN_REDIRECT_URI:http://localhost:8080/auth/linkedin/callback}
